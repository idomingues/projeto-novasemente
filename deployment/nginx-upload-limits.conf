# Limites de corpo HTTP no Nginx (evita 413 em uploads)
#
# Sintoma no browser: "413 Request Entity Too Large" com página genérica do nginx.
# O Laravel nem chega a receber o POST.
#
# Causa: o valor por omissão de client_max_body_size no Nginx é 1m.
#
# Margem para: vídeo do feed até 50 MB + imagem + multipart no mesmo pedido.
#
# Como aplicar (Ubuntu):
# 1) Abra o ficheiro do site, ex.: /etc/nginx/sites-available/app.novasemente.com.br
# 2) Dentro do bloco server { ... } do domínio em HTTPS, adicione:
#    include /caminho/absoluto/projeto-novasemente/deployment/nginx-upload-limits.conf;
#    — ou copie a linha client_max_body_size para dentro do server { }
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# PHP-FPM / php.ini (valores >= ao corpo máximo):
#   upload_max_filesize = 64M
#   post_max_size = 72M
#
# Script automatizado no servidor: sudo bash deployment/apply-upload-limits.sh

client_max_body_size 64M;
