<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Exemplo  Central de Serviços">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0fdfa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="220" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="920" cy="880" r="280" fill="#042f2e" fill-opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="120" y="220" width="840" height="640" rx="48" fill="url(#card)"/>
  </g>
  <rect x="160" y="280" width="360" height="260" rx="28" fill="#ccfbf1"/>
  <rect x="190" y="310" width="140" height="18" rx="9" fill="#0d9488"/>
  <rect x="190" y="345" width="220" height="12" rx="6" fill="#99f6e4"/>
  <rect x="190" y="370" width="180" height="12" rx="6" fill="#99f6e4"/>
  <circle cx="430" cy="410" r="52" fill="#14b8a6"/>
  <path d="M410 410 L450 410 M430 390 L430 430" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <rect x="560" y="300" width="340" height="220" rx="24" fill="#134e4a"/>
  <text x="590" y="360" fill="#ccfbf1" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="700">Identidade visual</text>
  <text x="590" y="410" fill="#99f6e4" font-family="system-ui,Segoe UI,sans-serif" font-size="22">Convites · redes · slides</text>
  <text x="590" y="470" fill="#5eead4" font-family="system-ui,Segoe UI,sans-serif" font-size="18">Colaboração entre membros</text>
  <g transform="translate(160 600)">
    <rect width="760" height="200" rx="28" fill="#0f766e"/>
    <text x="40" y="70" fill="#ecfdf5" font-family="system-ui,Segoe UI,sans-serif" font-size="42" font-weight="800">Central de Serviços</text>
    <text x="40" y="125" fill="#ccfbf1" font-family="system-ui,Segoe UI,sans-serif" font-size="24">Ofereço apoio criativo para eventos da igreja</text>
    <text x="40" y="165" fill="#99f6e4" font-family="system-ui,Segoe UI,sans-serif" font-size="20">Publicação fictícia para demonstração do app</text>
  </g>
  <g transform="translate(640 120) rotate(-8)">
