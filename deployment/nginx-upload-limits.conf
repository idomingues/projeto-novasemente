# Limites de corpo HTTP no Nginx (evita 413 em uploads da Biblioteca e similares)
#
# Sintoma no browser: "413 Request Entity Too Large" com página genérica do nginx,
# mesmo com PDF abaixo do limite da app (ex.: 7,5 MB). O Laravel nem chega a receber o POST.
#
# Causa: o valor por omissão de client_max_body_size no Nginx é 1m.
#
# A biblioteca valida PDF até 20 MB e capa até 4 MB no mesmo pedido multipart — reserve margem.
#
# Como aplicar (Ubuntu):
# 1) Abra o ficheiro do site, ex.: /etc/nginx/sites-available/app.novasemente.com.br
# 2) Dentro do bloco server { ... } do domínio em HTTPS, adicione a linha abaixo
#    (ou inclua este ficheiro com: include /caminho/absoluto/nginx-upload-limits.conf;)
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# No PHP-FPM / php.ini, confirme também (valores >= ao corpo máximo esperado):
#   upload_max_filesize = 32M
#   post_max_size = 32M
#
# Se existir outro proxy (Cloudflare, ALB, etc.), verifique limites de upload lá também.

client_max_body_size 32M;
