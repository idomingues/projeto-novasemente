name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/projeto-novasemente
            # Full: descarta alterações locais no servidor e puxa exatamente o main
            git fetch origin main && git reset --hard origin/main
            # Aplicar limites de upload para PDF/capa da Biblioteca em produção.
            bash deployment/apply-upload-limits.sh
            # Garantir cron do Laravel Schedule (meditação 05:00, revista, acervo, etc.).
            bash deployment/ensure-laravel-scheduler-cron.sh
            # Limpar caches/views antigas para forçar uso do código novo (header, etc.)
            php artisan optimize:clear 2>/dev/null || true
            find storage/framework/views -name '*.php' -delete 2>/dev/null || true
            find bootstrap/cache -name '*.php' -delete 2>/dev/null || true
            composer install --no-dev --optimize-autoloader
            rm -rf node_modules
            npm ci --no-fund
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build
            php artisan migrate --force
            php artisan communities:install-defaults
            php artisan app:seed-talent-demo-listings
            # Registar versão web automaticamente (para aparecer no card "Versão").
            RELEASE_SHA="$(git rev-parse --short HEAD)"
            RELEASE_VER="v2.${{ github.run_number }}"
            php artisan app:release --version="${RELEASE_VER}" --released_at="$(date -Iseconds)" --notes-file=deployment/release-notes.txt
            # php artisan db:seed --force  # só se quiser repopular
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan permission:cache-reset 2>/dev/null || true
            echo "Deploy concluído. Commit: $(git rev-parse --short HEAD)"
            php artisan schedule:list 2>/dev/null || true
